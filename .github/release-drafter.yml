# Continuously drafts release notes from merged PRs, keyed to the current
# milestone. The authoritative notes for a release are still generated by
# milestone-release.yml from the milestone's issues.
name-template: "$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "✨ Features"
    labels: ["type:feature"]
  - title: "🐛 Fixes"
    labels: ["type:fix"]
  - title: "🚑 Hotfixes"
    labels: ["type:hotfix"]
  - title: "🧹 Maintenance"
    labels: ["chore", "docs"]

exclude-labels:
  - backport

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
no-changes-template: "- No user-facing changes"

version-resolver:
  major:
    labels: ["release:major"]
  minor:
    labels: ["type:feature"]
  patch:
    labels: ["type:fix", "type:hotfix"]
  default: patch

template: |
  $CHANGES

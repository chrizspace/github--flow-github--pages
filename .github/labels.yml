# Label taxonomy — the single source of truth, synced by .github/workflows/labels.yml
- name: "type:feature"
  color: "0e8a16"
  description: "New functionality. Branch: feature/<issue>-desc -> dev"
- name: "type:fix"
  color: "d73a4a"
  description: "Non-critical bug fix. Branch: fix/<issue>-desc -> dev"
- name: "type:hotfix"
  color: "b60205"
  description: "Urgent production fix. Branch: hotfix/<issue>-desc -> prod"
- name: "backport"
  color: "5319e7"
  description: "Automated backport PR. Never closes an issue, never bumps a version."
- name: "release"
  color: "1d76db"
  description: "Release automation / promotion activity"
- name: "docs"
  color: "0075ca"
  description: "Documentation only"
- name: "chore"
  color: "cfd3d7"
  description: "Maintenance, tooling, CI"
